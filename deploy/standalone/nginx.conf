server {
  listen 80;
  server_tokens off;
  client_max_body_size 20m;
  location = /api/standalone/import { return 404; }
  location = /api/standalone/admin { return 404; }
  # Look runtime up per request (Docker's DNS, cached 10s): a redeploy that
  # recreates runtime but not web gives it a new address, and a name resolved
  # once at startup would send every request to the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location / {
    set $runtime http://runtime:8080;
    proxy_pass $runtime;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Better Auth reads CF-Connecting-IP before X-Real-IP; only Cloudflare may set it.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
}
